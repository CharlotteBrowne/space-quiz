<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Exploration Quiz</title>
<style>
:root {
  --bg: #f4f6fb; --card: #fff; --text: #1b2033; --muted: #6a7188;
  --border: #dde1ee; --accent: #5b6cff; --track: #e3e6f3;
  --good: #1fa463; --good-bg: #dff5e9; --bad: #e0394b; --bad-bg: #fde3e6;
  --shadow: 0 10px 30px rgba(40, 50, 100, .12);
  --grid: rgba(91, 108, 255, .07);
  --glow: transparent;
  --mono: ui-monospace, "SF Mono", Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1020; --card: #151a30; --text: #e8ebf7; --muted: #959cb8;
    --border: #272e4d; --accent: #8091ff; --track: #252b49;
    --good: #3ddc97; --good-bg: #123a2c; --bad: #ff6b7d; --bad-bg: #43161f;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    --grid: rgba(128, 145, 255, .09);
    --glow: rgba(128, 145, 255, .55);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
  padding: 32px 16px; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
main {
  width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 24px; box-shadow: var(--shadow);
}
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
.top { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.score { font-weight: 600; color: var(--text); }
.score.bump { animation: bump .4s; }
.bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; margin-bottom: 22px; }
.bar > div { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #c06bff); transition: width .4s ease; }
.q { font-size: 17px; font-weight: 600; margin: 0 0 14px; }
.opts { display: grid; gap: 10px; }
button.opt {
  font: inherit; text-align: left; color: var(--text); background: var(--card);
  border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 14px; cursor: pointer;
  transition: border-color .15s, background .15s, transform .15s;
}
button.opt:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
button.opt:focus-visible, .next:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.opt:disabled { cursor: default; }
.opt.correct { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 600; animation: pop .4s; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); animation: shake .45s; }
.fact { min-height: 22px; margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.next {
  margin-top: 14px; width: 100%; font: inherit; font-weight: 600; padding: 11px; border: 0;
  border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; visibility: hidden;
}
.next.show { visibility: visible; animation: fade .3s; }
.result { text-align: center; animation: fade .5s; }
.emoji { font-size: 64px; line-height: 1.2; animation: pop .6s; }
.big { font-size: 36px; font-weight: 700; margin: 4px 0; }
/* Mission-control panel */
main {
  position: relative;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; background-color: var(--card);
}
main::before, main::after {
  content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid var(--accent); pointer-events: none;
}
main::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: 16px; }
main::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: 16px; }
h1 {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-bottom: 12px;
  font: 700 16px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  background: linear-gradient(90deg, var(--accent) 0 64px, var(--border) 64px) bottom / 100% 2px no-repeat;
  text-shadow: 0 0 12px var(--glow);
}
h1 + .sub { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; }
h1::after {
  content: "LIVE"; margin-left: auto; font: 600 11px/1 var(--mono); letter-spacing: .12em; color: var(--good);
  padding: 4px 7px 4px 18px; border: 1px solid var(--good); border-radius: 4px;
  background: radial-gradient(circle at 9px 50%, var(--good) 0 3px, transparent 4px); animation: blink 2s steps(2, jump-none) infinite;
}
.top { font: 600 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.score { font-variant-numeric: tabular-nums; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); }
.bar { height: 12px; border-radius: 3px; border: 1px solid var(--border); padding: 2px; }
.bar > div {
  border-radius: 1px; background: var(--accent);
  -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(10% - 3px), transparent calc(10% - 3px) 10%);
  mask: repeating-linear-gradient(90deg, #000 0 calc(10% - 3px), transparent calc(10% - 3px) 10%);
}
.q { padding-left: 12px; border-left: 3px solid var(--accent); }
.opts { counter-reset: o; }
button.opt { counter-increment: o; display: flex; gap: 12px; align-items: baseline; border-radius: 6px; }
button.opt::before {
  content: counter(o, upper-alpha); font: 700 12px/1 var(--mono); color: var(--accent);
  min-width: 22px; padding: 4px 0; text-align: center; border: 1px solid currentColor; border-radius: 3px;
}
.opt.correct::before, .opt.wrong::before { color: currentColor; }
.fact { font-family: var(--mono); font-size: 13px; }
.next, .next.show { border-radius: 6px; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; }
@keyframes blink { 50% { opacity: .55 } }

[hidden] { display: none !important; }
@keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-8px) } 40% { transform: translateX(8px) } 60% { transform: translateX(-6px) } 80% { transform: translateX(6px) } }
@keyframes pop { 0% { transform: scale(.94) } 50% { transform: scale(1.04) } 100% { transform: scale(1) } }
@keyframes bump { 50% { transform: scale(1.3); color: var(--good) } }
@keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>🚀 Space Exploration Quiz</h1>
  <p class="sub">10 questions. How well do you know the cosmos?</p>
  <section id="quiz">
    <div class="top"><span id="count">Question 1 of 10</span><span class="score" id="score">Score: 0</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="barWrap"><div id="bar"></div></div>
    <p class="q" id="q"></p>
    <div class="opts" id="opts"></div>
    <p class="fact" id="fact" aria-live="polite"></p>
    <button class="next" id="next">Next</button>
  </section>
  <section class="result" id="result" hidden>
    <div class="emoji" id="emoji"></div>
    <div class="big" id="final"></div>
    <p id="msg"></p>
    <button class="next show" id="again">Play again</button>
  </section>
</main>
<script>
const QUESTIONS = [
  ["Who was the first human to travel into space?", ["Neil Armstrong", "Yuri Gagarin", "Alan Shepard", "Buzz Aldrin"], 1, "Gagarin orbited Earth on 12 April 1961."],
  ["Which mission first landed humans on the Moon?", ["Apollo 8", "Apollo 11", "Apollo 13", "Gemini 4"], 1, "Apollo 11 landed in July 1969."],
  ["Which planet is known as the Red Planet?", ["Venus", "Jupiter", "Mars", "Mercury"], 2, "Iron oxide on its surface gives Mars its colour."],
  ["What was the first artificial satellite?", ["Explorer 1", "Vostok 1", "Sputnik 1", "Telstar"], 2, "Sputnik 1 launched in October 1957."],
  ["Which telescope launched in 2021 to observe in infrared?", ["Hubble", "James Webb", "Kepler", "Spitzer"], 1, "JWST orbits near the Sun–Earth L2 point."],
  ["Which spacecraft has travelled farthest from Earth?", ["Voyager 1", "Pioneer 10", "New Horizons", "Cassini"], 0, "Voyager 1 entered interstellar space in 2012."],
  ["Which planet has the most prominent ring system?", ["Uranus", "Neptune", "Jupiter", "Saturn"], 3, "Saturn's rings are mostly water ice."],
  ["What is the name of the first space station to be permanently crewed by multiple nations?", ["Mir", "Skylab", "ISS", "Tiangong"], 2, "The ISS has been continuously occupied since 2000."],
  ["Which rover landed on Mars in February 2021?", ["Curiosity", "Perseverance", "Opportunity", "Spirit"], 1, "Perseverance carried the Ingenuity helicopter."],
  ["Who was the first woman in space?", ["Sally Ride", "Valentina Tereshkova", "Mae Jemison", "Peggy Whitson"], 1, "Tereshkova flew on Vostok 6 in 1963."]
];
const $ = id => document.getElementById(id);
let i, score, locked;

function start() {
  i = 0; score = 0;
  $("result").hidden = true; $("quiz").hidden = false;
  render();
}
function render() {
  const [q, opts] = QUESTIONS[i];
  locked = false;
  $("count").textContent = `Question ${i + 1} of ${QUESTIONS.length}`;
  $("score").textContent = `Score: ${score}`;
  $("bar").style.width = (i / QUESTIONS.length * 100) + "%";
  $("barWrap").setAttribute("aria-valuenow", i);
  $("q").textContent = q;
  $("fact").textContent = "";
  $("next").classList.remove("show");
  $("next").textContent = i === QUESTIONS.length - 1 ? "See results" : "Next";
  $("opts").innerHTML = "";
  opts.forEach((text, idx) => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = text;
    b.onclick = () => answer(idx);
    $("opts").appendChild(b);
  });
}
function answer(idx) {
  if (locked) return;
  locked = true;
  const [, , correct, fact] = QUESTIONS[i];
  const btns = [...$("opts").children];
  btns.forEach(b => b.disabled = true);
  btns[correct].classList.add("correct");
  if (idx === correct) {
    score++;
    $("score").textContent = `Score: ${score}`;
    $("score").classList.remove("bump"); void $("score").offsetWidth; $("score").classList.add("bump");
    $("fact").textContent = "✅ Correct! " + fact;
  } else {
    btns[idx].classList.add("wrong");
    $("fact").textContent = "❌ Not quite. " + fact;
  }
  $("bar").style.width = ((i + 1) / QUESTIONS.length * 100) + "%";
  $("barWrap").setAttribute("aria-valuenow", i + 1);
  $("next").classList.add("show");
  $("next").focus();
}
$("next").onclick = () => {
  if (++i < QUESTIONS.length) render(); else finish();
};
function finish() {
  $("quiz").hidden = true; $("result").hidden = false;
  const pct = score / QUESTIONS.length;
  const [e, m] = pct === 1 ? ["🏆", "Flawless! Mission commander material."]
    : pct >= .8 ? ["🚀", "Stellar work! You're ready for launch."]
    : pct >= .6 ? ["🌟", "Nice orbit! A little more study and you're there."]
    : pct >= .4 ? ["🛰️", "Still in low Earth orbit. Keep exploring!"]
    : ["🌑", "Houston, we have a problem. Try again!"];
  $("emoji").textContent = e;
  $("final").textContent = `${score} / ${QUESTIONS.length}`;
  $("msg").textContent = m;
  $("again").focus();
}
$("again").onclick = start;
start();
</script>
</body>
</html>
